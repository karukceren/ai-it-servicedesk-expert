# =============================================================================
# Docker Compose Multi-Container Orchestration
# Project: Akıllı Servis Masası ve Sistem Uzmanı Chatbot (PRJIC20260201)
# =============================================================================

name: ai_servicedesk_system

services:
  # ---------------------------------------------------------------------------
  # 1. Database Service (PostgreSQL 16 + pgvector)
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_servicedesk_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_support_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-it_support_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai_servicedesk_network

  # ---------------------------------------------------------------------------
  # 2. Backend API Service (FastAPI + RAG Engine + SSE Streaming)
  # ---------------------------------------------------------------------------
  api:
    image: ai-servicedesk-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai_servicedesk_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-it_support_db}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai_servicedesk_network

  # ---------------------------------------------------------------------------
  # 3. Frontend Web UI Service (Streamlit Dashboard & Chat UI)
  # ---------------------------------------------------------------------------
  ui:
    image: ai-servicedesk-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: ai_servicedesk_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      BACKEND_URL: http://api:8000
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - api
    networks:
      - ai_servicedesk_network

# =============================================================================
# Networks & Persistent Volumes
# =============================================================================
networks:
  ai_servicedesk_network:
    name: ai_servicedesk_network
    driver: bridge

volumes:
  pgdata:
    name: ai_servicedesk_pgdata
